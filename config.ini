[aim]
screen_center_offset = 0
aim_smoothing_factor = 0
speed = 0.6        
y_speed_multiplier = 1
aim_height = 0.5

[communication]
type = winapi
microcontroller_ip = 0.0.0.0
microcontroller_port = 50256
com_port = 1

[screen]
group_close_target_blobs_threshold = 3, 3

upper_color = 13, 255, 255
lower_color = 8, 100, 0

capture_fov_x = 350
capture_fov_y = 350
aim_fov_x = 350
aim_fov_y = 350
max_loops_per_sec = 60
auto_detect_resolution = true
resolution_x = 1920
resolution_y = 1080

[recoil]
mode = move
recoil_x = 0.0
recoil_y = 0.0
max_offset = 100
recover = 0.0

[trigger]
trigger_delay = 0
trigger_randomization = 0
trigger_threshold = 0

[rapid_fire]
target_cps = 10

[key_binds]
key_reload_config = 0x70
key_toggle_recoil = 0x72
key_exit = 0x73
key_trigger = 0x06
aim_keys = 0x05

[debug]
enabled = true
always_on = true
display_mode = mask
debug_fullscreen_capture = false
